name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # read-only job; nothing after checkout uses git credentials

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.6
          tofu_wrapper: false # The YAML parser test passes an expression through console stdin.

      - name: Install the pinned encryption tool for native snapshot tests
        run: |
          curl --disable --fail --silent --show-error --proto '=https' --location --max-redirs 3 --connect-timeout 10 --max-time 60 --output "$RUNNER_TEMP/age.tar.gz" https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz
          printf '%s  %s\n' cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10 "$RUNNER_TEMP/age.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/age.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/age" >> "$GITHUB_PATH"

      - name: Validate repository
        run: scripts/test.sh


  retired-repo-links:
    name: Retired repository links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Check documentation links
        id: links
        uses: devantler-tech/.github/actions/validate-retired-repo-links@bd24a3e1bbbf6aba2d7afd58a2fd8a3d67bebe6b  # v19.0.3
        with:
          enabled: "true"

      - name: Require a complete scan
        env:
          VALIDATED: ${{ steps.links.outputs.validated }}
        run: test "$VALIDATED" = true

      - name: Prepare disposable README defect
        run: |
          mkdir -p "$RUNNER_TEMP/retired-links-fixture/.github"
          cp README.md AGENTS.md "$RUNNER_TEMP/retired-links-fixture/"
          printf '\n[Retired catalogue](https://github.com/devantler-tech/reusable-workflows)\n' >> "$RUNNER_TEMP/retired-links-fixture/README.md"
          cp .github/retired-repo-links.json "$RUNNER_TEMP/retired-links-fixture/.github/retired-repo-links.json"

      - name: Reject the retired README link
        id: retired
        continue-on-error: true
        uses: devantler-tech/.github/actions/validate-retired-repo-links@bd24a3e1bbbf6aba2d7afd58a2fd8a3d67bebe6b  # v19.0.3
        with:
          enabled: "true"
          working-directory: ${{ runner.temp }}/retired-links-fixture

      - name: Reject missing configuration
        id: missing
        continue-on-error: true
        uses: devantler-tech/.github/actions/validate-retired-repo-links@bd24a3e1bbbf6aba2d7afd58a2fd8a3d67bebe6b  # v19.0.3
        with:
          enabled: "true"
          config-file: .github/missing-retired-repo-links.json

      - name: Verify negative action outcomes
        if: ${{ always() }}
        env:
          CLEAN_VALIDATED: ${{ steps.links.outputs.validated }}
          RETIRED_OUTCOME: ${{ steps.retired.outcome }}
          RETIRED_VALIDATED: ${{ steps.retired.outputs.validated }}
          MISSING_OUTCOME: ${{ steps.missing.outcome }}
          MISSING_VALIDATED: ${{ steps.missing.outputs.validated }}
        run: |
          test "$CLEAN_VALIDATED" = true
          test "$RETIRED_OUTCOME" = failure
          test -z "$RETIRED_VALIDATED"
          test "$MISSING_OUTCOME" = failure
          test -z "$MISSING_VALIDATED"

      - name: Checkout released validator for diagnostic proof
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: devantler-tech/.github
          ref: bd0035dd8f41fcf1459b878882b8897443f8dc59  # v4.9.4
          path: .retired-repo-links-validator
          persist-credentials: false

      - name: Verify exact failure codes and diagnostics
        env:
          GOWORK: "off"
          GOFLAGS: ""
          GOTOOLCHAIN: local
        run: |
          go -C .retired-repo-links-validator/actions/validate-retired-repo-links build -mod=readonly -trimpath -o "$RUNNER_TEMP/retired-repo-links" .
          bash scripts/test-retired-repo-links.sh "$RUNNER_TEMP/retired-repo-links"

  required-checks:
    name: CI - Required Checks
    if: always()
    runs-on: ubuntu-latest
    needs: [validate, retired-repo-links]
    permissions: {}
    steps:
      - name: ✅ Aggregate job checks
        uses: devantler-tech/.github/actions/aggregate-job-checks@cd557b575d7f608caa2aa221e0fc854f1e3a95e1 # v13.2.1
        with:
          job-results: >-
            ${{ needs.validate.result }}
            ${{ needs.retired-repo-links.result }}
