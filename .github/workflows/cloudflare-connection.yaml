name: Cloudflare connection (read-only)

"on":
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type VERIFY_READ_ONLY to check the existing CI connection
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Require main and typed confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] || [ "$GITHUB_REF" != refs/heads/main ] || [ "$CONFIRMATION" != VERIFY_READ_ONLY ]; then
            echo 'Read-only connection check refused: use main and the exact confirmation.' >&2
            exit 2
          fi

      - name: Check out the confirmed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify existing Cloudflare connection
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bash scripts/check-cloudflare-connection.sh
