name: Alert journal native R2 proof

"on":
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type PROVE_ALERT_JOURNAL to write one isolated synthetic proof object
        required: true
        type: string

permissions:
  contents: read
concurrency:
  group: cloudflare-bootstrap-migration
  cancel-in-progress: false

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Require the confirmed first-attempt main dispatch
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" == refs/heads/main && "$GITHUB_REPOSITORY" == devantler-tech/cloudflare && "$GITHUB_ACTOR" == devantler && "$GITHUB_RUN_ATTEMPT" == 1 && "$RUNNER_ENVIRONMENT" == github-hosted && "$GITHUB_WORKFLOW_REF" == devantler-tech/cloudflare/.github/workflows/alert-journal-native.yaml@refs/heads/main && "$CONFIRMATION" == PROVE_ALERT_JOURNAL ]]
      - name: Check out the reviewed Cloudflare owner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check out the reviewed journal source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: devantler-tech/platform
          ref: 19accd41ee1e12493b7d56ddf175dde3efb7ce00
          path: journal-source
          persist-credentials: false
      - name: Install the source's Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: journal-source/go.mod
          cache: false
      - name: Compile the existing native test before restoring credentials
        working-directory: journal-source
        env:
          GOTOOLCHAIN: local
          GOWORK: "off"
          GOFLAGS: -mod=readonly
        run: go test -c -o "$RUNNER_TEMP/native-alert-journal.test" ./scripts/alert-publisher
      - name: Install the pinned encryption tool
        run: |
          curl --disable --fail --silent --show-error --proto '=https' --location --max-redirs 3 --connect-timeout 10 --max-time 60 --output "$RUNNER_TEMP/age.tar.gz" https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz
          printf '%s  %s\n' cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10 "$RUNNER_TEMP/age.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/age.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/age" >> "$GITHUB_PATH"
      - name: Verify restricted storage and run the native journal test
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OUTPUT_DIR: ${{ runner.temp }}/alert-journal-native
        run: bash scripts/prove-alert-journal-native.sh "$GITHUB_WORKSPACE"
      - name: Retain only encrypted native evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: encrypted-alert-journal-native-proof
          path: |
            ${{ runner.temp }}/alert-journal-native/evidence.tar.gz.age
            ${{ runner.temp }}/alert-journal-native/manifest.json
          if-no-files-found: warn # Dispatch/credential refusals collect no evidence.
          retention-days: 1
          overwrite: false
          compression-level: 0
