name: Guarded native state migration and independent recovery

"on":
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type MIGRATE_STATE_BACKEND to copy the frozen state into the empty backend
        required: true
        type: string
      proof_run:
        description: Successful first-attempt synthetic backend proof at this exact main revision
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: cloudflare-bootstrap-migration
  cancel-in-progress: false

jobs:
  migrate:
    name: Migrate the frozen native state without provider writes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require the confirmed first-attempt main dispatch
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch || "$GITHUB_REF" != refs/heads/main || "$GITHUB_REPOSITORY" != devantler-tech/cloudflare || "$GITHUB_ACTOR" != devantler || "$GITHUB_RUN_ATTEMPT" != 1 || "$RUNNER_ENVIRONMENT" != github-hosted || "$GITHUB_WORKFLOW_REF" != devantler-tech/cloudflare/.github/workflows/state-backend-migrate.yaml@refs/heads/main || "$CONFIRMATION" != MIGRATE_STATE_BACKEND ]]; then
            echo 'CLOUDFLARE_STATE_MIGRATION=UNVERIFIED stage=dispatch' >&2
            exit 2
          fi

      - name: Check out the confirmed immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install the pinned OpenTofu CLI
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.6
          tofu_wrapper: false

      - name: Install the pinned encryption tool
        run: |
          curl --disable --fail --silent --show-error --proto '=https' --location --max-redirs 3 --connect-timeout 10 --max-time 60 --output "$RUNNER_TEMP/age.tar.gz" https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz
          printf '%s  %s\n' cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10 "$RUNNER_TEMP/age.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/age.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/age" >> "$GITHUB_PATH"

      - name: Migrate the authenticated source and capture recovery
        id: migration
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          PROOF_RUN: ${{ inputs.proof_run }}
          MIGRATION_PHASE: migrate
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_BOOTSTRAP_CONFIGURATION: ${{ secrets.CLOUDFLARE_BOOTSTRAP_CONFIGURATION }}
          CLOUDFLARE_BOOTSTRAP_MIGRATION_STATE: ${{ secrets.CLOUDFLARE_BOOTSTRAP_MIGRATION_STATE }}
          OUTPUT_DIR: ${{ runner.temp }}/state-migration
        run: bash scripts/migrate-state-backend.sh "$GITHUB_WORKSPACE"

      - name: Retain authenticated ciphertext and encrypted diagnostics
        if: ${{ always() && steps.migration.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: encrypted-state-migration
          path: |
            ${{ runner.temp }}/state-migration/state/manifest.json
            ${{ runner.temp }}/state-migration/state/state.json.age
            ${{ runner.temp }}/state-migration/state/configuration.json.age
            ${{ runner.temp }}/state-migration/evidence.tar.gz.age
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
          overwrite: false
          include-hidden-files: false

  recover:
    name: Recover from R2 on an independent fresh runner
    needs: migrate
    if: ${{ always() && !cancelled() && needs.migrate.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require the confirmed first-attempt main dispatch
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch || "$GITHUB_REF" != refs/heads/main || "$GITHUB_REPOSITORY" != devantler-tech/cloudflare || "$GITHUB_ACTOR" != devantler || "$GITHUB_RUN_ATTEMPT" != 1 || "$RUNNER_ENVIRONMENT" != github-hosted || "$GITHUB_WORKFLOW_REF" != devantler-tech/cloudflare/.github/workflows/state-backend-migrate.yaml@refs/heads/main || "$CONFIRMATION" != MIGRATE_STATE_BACKEND ]]; then
            echo 'CLOUDFLARE_STATE_MIGRATION=UNVERIFIED stage=dispatch' >&2
            exit 2
          fi

      - name: Check out the confirmed immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install the pinned OpenTofu CLI
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.6
          tofu_wrapper: false

      - name: Install the pinned encryption tool
        run: |
          curl --disable --fail --silent --show-error --proto '=https' --location --max-redirs 3 --connect-timeout 10 --max-time 60 --output "$RUNNER_TEMP/age.tar.gz" https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz
          printf '%s  %s\n' cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10 "$RUNNER_TEMP/age.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/age.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/age" >> "$GITHUB_PATH"

      - name: Recover without copied state or backend metadata
        id: recovery
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          PROOF_RUN: ${{ inputs.proof_run }}
          MIGRATION_PHASE: recover
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_BOOTSTRAP_CONFIGURATION: ${{ secrets.CLOUDFLARE_BOOTSTRAP_CONFIGURATION }}
          CLOUDFLARE_BOOTSTRAP_MIGRATION_STATE: ${{ secrets.CLOUDFLARE_BOOTSTRAP_MIGRATION_STATE }}
          OUTPUT_DIR: ${{ runner.temp }}/state-migration-recovery
        run: bash scripts/migrate-state-backend.sh "$GITHUB_WORKSPACE"

      - name: Retain independently recovered ciphertext and encrypted diagnostics
        if: ${{ always() && steps.recovery.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: encrypted-state-migration-recovery
          path: |
            ${{ runner.temp }}/state-migration-recovery/state/manifest.json
            ${{ runner.temp }}/state-migration-recovery/state/state.json.age
            ${{ runner.temp }}/state-migration-recovery/state/configuration.json.age
            ${{ runner.temp }}/state-migration-recovery/evidence.tar.gz.age
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
          overwrite: false
          include-hidden-files: false
