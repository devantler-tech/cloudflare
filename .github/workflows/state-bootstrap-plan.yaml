name: State bootstrap plan (encrypted, read-only)

"on":
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type PLAN_STATE_BOOTSTRAP to import the zone locally and propose the independent state bucket
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-bootstrap-migration
  cancel-in-progress: false

jobs:
  plan:
    name: Import and propose independent state storage
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Require reviewed main, the approved operator and a first attempt
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] || [ "$GITHUB_REF" != refs/heads/main ] || [ "$GITHUB_REPOSITORY" != devantler-tech/cloudflare ] || [ "$GITHUB_ACTOR" != devantler ] || [ "$GITHUB_RUN_ATTEMPT" != 1 ] || [ "$CONFIRMATION" != PLAN_STATE_BOOTSTRAP ]; then
            echo 'CLOUDFLARE_BOOTSTRAP_PLAN=UNVERIFIED stage=dispatch' >&2
            exit 2
          fi

      - name: Check out the confirmed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install the pinned OpenTofu CLI
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.6
          tofu_wrapper: false

      - name: Install the pinned encryption tool
        run: |
          curl --disable --fail --silent --show-error --proto '=https' --location --max-redirs 3 --connect-timeout 10 --max-time 60 --output "$RUNNER_TEMP/age.tar.gz" https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz
          printf '%s  %s\n' cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10 "$RUNNER_TEMP/age.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/age.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/age" >> "$GITHUB_PATH"

      - name: Import locally, validate the exact proposal and encrypt it
        id: proposal
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OUTPUT_DIR: ${{ runner.temp }}/state-bootstrap-plan
          DIAGNOSTICS_DIR: ${{ runner.temp }}/state-bootstrap-diagnostics
        run: bash scripts/plan-state-bootstrap.sh "$GITHUB_WORKSPACE"

      - name: Export only ciphertext and binding metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: encrypted-state-bootstrap-plan
          path: |
            ${{ runner.temp }}/state-bootstrap-plan/state/manifest.json
            ${{ runner.temp }}/state-bootstrap-plan/state/state.json.age
            ${{ runner.temp }}/state-bootstrap-plan/state/configuration.json.age
            ${{ runner.temp }}/state-bootstrap-plan/migration.tfplan.age
            ${{ runner.temp }}/state-bootstrap-plan/migration.tfplan.json.age
            ${{ runner.temp }}/state-bootstrap-plan/plan-manifest.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: false
          include-hidden-files: false

      - name: Retain encrypted evidence of a refused proposal
        if: ${{ failure() && steps.proposal.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: encrypted-state-bootstrap-diagnostics
          path: ${{ runner.temp }}/state-bootstrap-diagnostics/diagnostics.tar.gz.age
          if-no-files-found: warn # Early dispatch and credential refusals have no private capture.
          retention-days: 1
          compression-level: 0
          overwrite: false
          include-hidden-files: false
