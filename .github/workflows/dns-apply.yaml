name: DNS plan and guarded apply

"on":
  workflow_dispatch:
    inputs:
      mode:
        description: plan shows the reviewed DNS change; apply makes it
        type: choice
        options: [plan, apply]
        default: plan
        required: true
      confirmation:
        description: Type PLAN_DNS for plan, or APPLY_DNS for apply
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: cloudflare-bootstrap-migration
  cancel-in-progress: false

jobs:
  change:
    name: Plan or apply the reviewed DNS change
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require the confirmed first-attempt main dispatch
        env:
          DNS_MODE: ${{ inputs.mode }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch || "$GITHUB_REF" != refs/heads/main || "$GITHUB_REPOSITORY" != devantler-tech/cloudflare || "$GITHUB_ACTOR" != devantler || "$GITHUB_RUN_ATTEMPT" != 1 || "$RUNNER_ENVIRONMENT" != github-hosted || "$GITHUB_WORKFLOW_REF" != devantler-tech/cloudflare/.github/workflows/dns-apply.yaml@refs/heads/main ]]; then
            echo 'CLOUDFLARE_DNS_CHANGE=UNVERIFIED stage=dispatch' >&2
            exit 2
          fi
          if [[ ! ( "$DNS_MODE" == plan && "$CONFIRMATION" == PLAN_DNS ) && ! ( "$DNS_MODE" == apply && "$CONFIRMATION" == APPLY_DNS ) ]]; then
            echo 'CLOUDFLARE_DNS_CHANGE=UNVERIFIED stage=dispatch' >&2
            exit 2
          fi

      - name: Check out the confirmed immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install the pinned OpenTofu CLI
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.6
          tofu_wrapper: false

      - name: Install the pinned encryption tool
        run: |
          curl --disable --fail --silent --show-error --proto '=https' --location --max-redirs 3 --connect-timeout 10 --max-time 60 --output "$RUNNER_TEMP/age.tar.gz" https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz
          printf '%s  %s\n' cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10 "$RUNNER_TEMP/age.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/age.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/age" >> "$GITHUB_PATH"

      - name: Plan, check the boundary and apply in apply mode
        id: change
        env:
          DNS_MODE: ${{ inputs.mode }}
          DNS_PHASE: change
          CONFIRMATION: ${{ inputs.confirmation }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_BOOTSTRAP_CONFIGURATION: ${{ secrets.CLOUDFLARE_BOOTSTRAP_CONFIGURATION }}
          OUTPUT_DIR: ${{ runner.temp }}/dns-change
        run: bash scripts/apply-dns.sh "$GITHUB_WORKSPACE"

      - name: Retain encrypted state captures and evidence
        if: ${{ always() && steps.change.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: encrypted-dns-change
          path: |
            ${{ runner.temp }}/dns-change/before/manifest.json
            ${{ runner.temp }}/dns-change/before/state.json.age
            ${{ runner.temp }}/dns-change/before/configuration.json.age
            ${{ runner.temp }}/dns-change/after/manifest.json
            ${{ runner.temp }}/dns-change/after/state.json.age
            ${{ runner.temp }}/dns-change/after/configuration.json.age
            ${{ runner.temp }}/dns-change/evidence.tar.gz.age
          if-no-files-found: warn # Early refusals have no private capture.
          retention-days: 7
          compression-level: 0
          overwrite: false
          include-hidden-files: false

  recover:
    name: Recover from R2 on a fresh runner and require no changes
    needs: change
    if: ${{ inputs.mode == 'apply' && needs.change.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require the confirmed first-attempt main dispatch
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch || "$GITHUB_REF" != refs/heads/main || "$GITHUB_REPOSITORY" != devantler-tech/cloudflare || "$GITHUB_ACTOR" != devantler || "$GITHUB_RUN_ATTEMPT" != 1 || "$RUNNER_ENVIRONMENT" != github-hosted || "$GITHUB_WORKFLOW_REF" != devantler-tech/cloudflare/.github/workflows/dns-apply.yaml@refs/heads/main || "$CONFIRMATION" != APPLY_DNS ]]; then
            echo 'CLOUDFLARE_DNS_CHANGE=UNVERIFIED stage=dispatch' >&2
            exit 2
          fi

      - name: Check out the confirmed immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install the pinned OpenTofu CLI
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.6
          tofu_wrapper: false

      - name: Install the pinned encryption tool
        run: |
          curl --disable --fail --silent --show-error --proto '=https' --location --max-redirs 3 --connect-timeout 10 --max-time 60 --output "$RUNNER_TEMP/age.tar.gz" https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz
          printf '%s  %s\n' cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10 "$RUNNER_TEMP/age.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/age.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/age" >> "$GITHUB_PATH"

      - name: Recover without copied state and require a clean plan
        id: recovery
        env:
          DNS_MODE: apply
          DNS_PHASE: recover
          CONFIRMATION: ${{ inputs.confirmation }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_BOOTSTRAP_CONFIGURATION: ${{ secrets.CLOUDFLARE_BOOTSTRAP_CONFIGURATION }}
          OUTPUT_DIR: ${{ runner.temp }}/dns-recovery
        run: bash scripts/apply-dns.sh "$GITHUB_WORKSPACE"

      - name: Retain the independently recovered capture
        if: ${{ always() && steps.recovery.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: encrypted-dns-recovery
          path: |
            ${{ runner.temp }}/dns-recovery/recovered/manifest.json
            ${{ runner.temp }}/dns-recovery/recovered/state.json.age
            ${{ runner.temp }}/dns-recovery/recovered/configuration.json.age
            ${{ runner.temp }}/dns-recovery/evidence.tar.gz.age
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
          overwrite: false
          include-hidden-files: false
